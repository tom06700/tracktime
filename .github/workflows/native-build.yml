name: Native compilation
on:
  pull_request:
    paths:
      - 'app/ios/**'
      - 'app/android/**'
      - 'app/pubspec.*'
      - '.github/workflows/native-build.yml'
permissions:
  contents: read
concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    # Standard runner: free for this public repository. No signing or upload.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --debug --no-codesign
        working-directory: app
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
