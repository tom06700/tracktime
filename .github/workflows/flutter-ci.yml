# Garde-fou sur l'application Flutter.
#
# Vercel ne construit plus rien de ce dépôt : sans cette CI, un commit
# n'affichait aucun signal sur l'état réel du code. Analyse et tests sont
# bloquants, sans aucun `continue-on-error` — un rouge ici veut dire que
# quelque chose est cassé.
name: Flutter CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-ci.yml'
  # Toutes les branches, pas seulement main : ce projet pousse directement sur
  # des branches sans passer par une pull request, qui n'auraient donc reçu
  # aucun signal.
  push:
    paths:
      - 'app/**'
      - 'codemagic.yaml'
      - '.github/workflows/flutter-ci.yml'

# Un seul run par référence : les pushs rapprochés annulent le précédent.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse-et-tests:
    name: analyse + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        # L'app vit dans app/, pas à la racine du dépôt.
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Même canal que Codemagic, qui construit l'IPA avec `flutter: stable`.
      # Le projet ne fige pas de version : figer ici créerait justement l'écart
      # qu'on cherche à éviter entre la CI et ce qui part en TestFlight.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Paquets pub, et la bibliothèque SQLite que le hook de `package:sqlite3`
      # télécharge une fois : sans ce cache, chaque run la retéléchargerait
      # depuis les artefacts de release GitHub.
      - name: Cache pub et bibliothèque SQLite
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool/hooks_runner/shared
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Récupérer les paquets
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      # Les tests n'appellent jamais le vrai TheTVDB : chaque client est
      # construit avec un MockClient, ou sans clé — auquel cas il refuse de
      # partir en réseau. La CI ne dépend donc d'aucun service tiers.
      - name: Tests
        timeout-minutes: 3
        run: flutter test --timeout 2m

      - name: Captures des composants retenus
        if: ${{ !cancelled() }}
        env:
          NITRATE_DESIGN_AUDIT: '1'
        run: flutter test test/modern_reference_audit_test.dart

      - name: Capturer les parcours existants
        timeout-minutes: 3
        if: ${{ !cancelled() }}
        env:
          NITRATE_AUDIT: '1'
        run: |
          python3 ../scripts/prepare_cinema_audit.py
          export NITRATE_AUDIT_FONTS="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          flutter test test/visual_audit_test.dart --timeout 10m
          cp build/audit/*.png build/modern-audit/

      - name: Capturer les prototypes fournis
        if: ${{ !cancelled() }}
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3000 --screenshot=build/modern-audit/reference-intro.png "file://$GITHUB_WORKSPACE/design/validated-handoff/previews/intro.html"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1600 --virtual-time-budget=1000 --screenshot=build/modern-audit/reference-controls.png "file://$GITHUB_WORKSPACE/design/validated-handoff/previews/controls.html"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=2000 --screenshot=build/modern-audit/reference-notifications.png "file://$GITHUB_WORKSPACE/design/validated-handoff/previews/notifications.html"

          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1200 --virtual-time-budget=2000 --screenshot=build/modern-audit/reference-episode.png "file://$GITHUB_WORKSPACE/design/validated-handoff/episode-detail/preview.html"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nitrate-modern-reference
          path: app/build/modern-audit/
          if-no-files-found: ignore
