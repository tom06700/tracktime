}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

@import url(&#x27;https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap&#x27;);
#nitrate-profile-directions .np-preview{--np-accent:#cab7ff;--np-speed:800ms;--np-radius:24px;position:relative;isolation:isolate;max-width:402px;margin:18px auto 0;background:#101113;color:#f2f3f5;font:14px/1.5 Inter,Arial,sans-serif;padding:24px 20px 20px;border-radius:24px;overflow:hidden;box-sizing:border-box}
#nitrate-profile-directions .np-preview *{box-sizing:border-box}
#nitrate-profile-directions .np-preview button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 180ms ease,background 180ms ease}
#nitrate-profile-directions .np-preview button:active{transform:scale(.965)}
#nitrate-profile-directions .np-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;position:relative;z-index:1}
#nitrate-profile-directions .np-brand{font-size:29px;font-weight:700;letter-spacing:1px}
#nitrate-profile-directions .np-settings{width:44px;height:44px;border-radius:50%;background:#222327;display:grid;place-items:center;color:#d7d5de}
#nitrate-profile-directions .np-settings svg{width:21px;height:21px}
#nitrate-profile-directions .np-identity{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 96px;column-gap:14px;align-items:center;padding:26px 20px 18px;border:1px solid #615274;border-top-color:#ae91d8;border-radius:var(--np-radius);background:radial-gradient(ellipse at 90% 0%,#31273e 0%,#1b1921 43%,#15151a 85%);overflow:hidden}
#nitrate-profile-directions .np-copy{position:relative;z-index:1;grid-column:1;grid-row:1}
#nitrate-profile-directions .np-eyebrow{font-size:10px;letter-spacing:2.1px;color:#b9afcb;font-weight:600;margin-bottom:12px}
#nitrate-profile-directions .np-name{font-size:43px;line-height:1.06;letter-spacing:-1.8px;font-weight:600;overflow-wrap:anywhere}
#nitrate-profile-directions .np-avatar{position:relative;width:96px;height:96px;padding:0;display:block;grid-column:2;grid-row:1;border:1px solid #d1b4ff;border-radius:50%;background:var(--np-accent);box-shadow:0 0 0 5px #342a43,0 10px 30px #0005;z-index:1}
#nitrate-profile-directions .np-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
#nitrate-profile-directions .np-pencil{display:none}
#nitrate-profile-directions .np-tagline{grid-column:1/-1;font-size:13px;color:#b6b0bf;margin-top:20px;position:relative;z-index:1}
#nitrate-profile-directions .np-membership{grid-column:1/-1;border-top:1px solid #3d3745;padding-top:19px;margin-top:24px;font-size:11px;color:#aaa3b6;position:relative;z-index:1}
#nitrate-profile-directions .np-edit{grid-column:1/-1;justify-self:end;display:flex;gap:9px;align-items:center;justify-content:center;border:0;border-radius:30px;background:#312b3e;color:var(--np-accent);padding:0 15px;min-height:44px;margin-top:14px;position:relative;z-index:1}
#nitrate-profile-directions .np-edit svg{width:16px;height:16px}
#nitrate-profile-directions .np-arrow{display:none}
#nitrate-profile-directions .np-stat{margin-top:28px;padding:24px 22px 26px;border-radius:24px;background:linear-gradient(130deg,#2b243a,#211d2e);border:1px solid #594a76;color:var(--np-accent);position:relative}
#nitrate-profile-directions .np-stat&gt;div{font-size:10px;letter-spacing:2px}
#nitrate-profile-directions .np-stat strong{display:block;font-size:37px;line-height:1.2;font-weight:600;letter-spacing:-1.2px;margin-top:16px}
#nitrate-profile-directions .np-shine{position:absolute;inset:-100%;pointer-events:none;transform:translateX(-60%) rotate(25deg);background:linear-gradient(90deg,transparent 43%,#e0bfff14 50%,transparent 57%);opacity:0}
#nitrate-profile-directions .np-stroke,#nitrate-profile-directions .np-beam{display:none}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-identity{display:flex;flex-direction:column;text-align:center;border:0;background:none;overflow:visible;padding:18px 0 12px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-toolbar{margin-bottom:15px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-avatar{order:-1;width:130px;height:130px;box-shadow:0 0 55px #ad85ff22,0 0 0 10px #b79dff08;margin:5px 0 24px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-pencil{display:grid;place-items:center;position:absolute;bottom:-3px;right:-3px;width:40px;height:40px;border-radius:50%;background:#79738f;border:1px solid #bfb5da;color:#fff}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-pencil svg{width:18px;height:18px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-copy{width:100%}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-eyebrow{letter-spacing:3px;color:var(--np-accent);margin-bottom:10px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-name{font-size:42px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-tagline{margin-top:16px;font-size:13px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-membership{border:0;padding:0;margin-top:15px;font-size:12px}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-edit{display:none}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-shine{display:none}
#nitrate-profile-directions [data-direction=&quot;2&quot;] .np-beam{display:block;position:absolute;top:-25px;left:12%;width:76%;height:310px;opacity:.75;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#cab7ff99 0%,#9f7dda22 42%,transparent 70%);filter:blur(14px);transform-origin:50% 0}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-identity{padding:16px 4px 0;border:0;background:none;grid-template-columns:minmax(0,1fr) 100px;overflow:visible;gap:0 12px}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-avatar{width:100px;height:114px;border-radius:23px;border:0;box-shadow:none;align-self:center;grid-row:1/3}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-avatar img{object-position:50% 45%}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-stroke{display:block;background:var(--np-accent);border-radius:4px;width:26px;height:4px;margin-bottom:15px;transform-origin:left}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-eyebrow{color:var(--np-accent);letter-spacing:2.5px;margin-bottom:15px;font-weight:400}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-name{font-size:57px;letter-spacing:-2px;font-weight:600}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-name:after{content:&#x27;.&#x27;}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-tagline{color:var(--np-accent);font-size:16px;grid-column:1/-1;margin-top:20px;font-weight:500}
#nitrate-profile-directions [data-direction=&quot;3&quot;] .np-membership{border:0;padding:0;margin-top:10px;font-size:12px}

&lt;script&gt;
(function(){
  const root=document.getElementById(&#x27;nitrate-profile-directions&#x27;);
  const preview=root.querySelector(&#x27;.np-preview&#x27;);
  const overlay=root.querySelector(&#x27;.np-overlay&#x27;);
  const input=root.querySelector(&#x27;#np-input&#x27;);
  const state={direction:&#x27;1&#x27;,name:&#x27;Tom&#x27;,duration:800,accent:&#x27;#cab7ff&#x27;,radius:24};
  let opener=null;
  function play(){preview.classList.remove(&#x27;np-playing&#x27;);void preview.offsetWidth;preview.classList.add(&#x27;np-playing&#x27;);}
  function render(){
    preview.dataset.direction=state.direction;
    preview.style.setProperty(&#x27;--np-speed&#x27;,state.duration+&#x27;ms&#x27;);
    preview.style.setProperty(&#x27;--np-accent&#x27;,state.accent);
    preview.style.setProperty(&#x27;--np-radius&#x27;,state.radius+&#x27;px&#x27;);
    root.querySelector(&#x27;.np-name&#x27;).textContent=state.name||&#x27;Cinéphile&#x27;;
    root.querySelector(&#x27;.np-eyebrow&#x27;).textContent=state.direction===&#x27;2&#x27;?&#x27;LE PREMIER RÔLE&#x27;:&#x27;MON CARNET&#x27;;
    root.querySelector(&#x27;.np-tagline&#x27;).textContent=state.direction===&#x27;3&#x27;?&#x27;Les histoires restent.&#x27;:&#x27;Chaque histoire laisse une trace.&#x27;;
    root.querySelector(&#x27;.np-edit span&#x27;).textContent=state.direction===&#x27;3&#x27;?&#x27;Modifier mon profil&#x27;:&#x27;Modifier&#x27;;
  }
  root.querySelectorAll(&#x27;[data-direction][role=&quot;tab&quot;]&#x27;).forEach(tab=&gt;tab.addEventListener(&#x27;click&#x27;,()=&gt;{
    state.direction=tab.dataset.direction;
    root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;).forEach(t=&gt;{const selected=t===tab;t.setAttribute(&#x27;aria-selected&#x27;,String(selected));t.classList.toggle(&#x27;active&#x27;,selected);});
    root.querySelector(&#x27;#np-panel&#x27;).hidden=false;
    root.querySelector(&#x27;#np-panel&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,tab.id);
    render();play();
  }));
  function edit(e){opener=e.currentTarget;input.value=state.name;overlay.hidden=false;input.focus({preventScroll:true});}
  function close(){overlay.hidden=true;opener?.focus({preventScroll:true});}
  root.querySelector(&#x27;.np-avatar&#x27;).addEventListener(&#x27;click&#x27;,edit);
  root.querySelector(&#x27;.np-edit&#x27;).addEventListener(&#x27;click&#x27;,edit);
  root.querySelector(&#x27;.np-cancel&#x27;).addEventListener(&#x27;click&#x27;,close);
  root.querySelector(&#x27;.np-close&#x27;).addEventListener(&#x27;click&#x27;,close);
  overlay.addEventListener(&#x27;click&#x27;,e=&gt;{if(e.target===overlay)close();});
  root.querySelector(&#x27;form&#x27;).addEventListener(&#x27;submit&#x27;,e=&gt;{e.preventDefault();state.name=input.value.trim()||&#x27;Cinéphile&#x27;;render();close();root.querySelector(&#x27;#np-status&#x27;).textContent=&#x27;Prénom modifié dans cet aperçu.&#x27;;});
  overlay.addEventListener(&#x27;keydown&#x27;,e=&gt;{
    if(e.key===&#x27;Escape&#x27;){e.preventDefault();close();}
    if(e.key===&#x27;Tab&#x27;){
      const items=Array.from(overlay.querySelectorAll(&#x27;button,input&#x27;));
      const first=items[0],last=items[items.length-1];
      if(e.shiftKey&amp;&amp;document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&amp;&amp;document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  root.querySelector(&#x27;#np-replay&#x27;).addEventListener(&#x27;click&#x27;,play);
  render();play();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:preview,onChange:()=&gt;{render();play();}});
    tweak.addSlider(state,&#x27;duration&#x27;,{label:&#x27;Durée de l’entrée&#x27;,min:300,max:1400,step:50,unit:&#x27;ms&#x27;});
    tweak.addColorPicker(state,&#x27;accent&#x27;,{label:&#x27;Accent lilas&#x27;,reference:&#x27;--np-accent&#x27;});
    tweak.addSlider(state,&#x27;radius&#x27;,{label:&#x27;Arrondi de la carte&#x27;,min:12,max:32,unit:&#x27;px&#x27;});
  }
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
