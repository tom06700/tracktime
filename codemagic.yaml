# Codemagic — build iOS signé et envoi vers TestFlight.
#
# Prérequis (une seule fois) :
#  1. App Store Connect : fiche créée avec le bundle id com.thomasgomez.tracktime
#  2. Codemagic > Teams > Integrations > Apple Developer Portal : clé API
#     « chez-nous-asc » (partagée avec l'autre app du compte).
#  3. Codemagic > Teams > Code signing identities : le certificat de
#     distribution iOS y est déjà, partagé entre les apps de l'équipe.
#  4. Un profil de provisionnement App Store doit exister pour le bundle id
#     sur developer.apple.com. `ios_signing` le RÉCUPÈRE mais ne le crée pas :
#     sans lui, le build échoue dès la configuration de l'environnement avec
#     « No matching profiles found ».
#  5. Codemagic > application > Webhooks : vérifier le webhook GitHub
#     (Update webhook si nécessaire). Les pushs sur main déclenchent TestFlight.

workflows:
  ios-testflight:
    name: Nitrate · iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # L'app Flutter vit dans app/, pas à la racine du dépôt.
    working_directory: app

    # Les changements sont regroupés en PR ; la fusion déclenche un push main.
    # Les branches de travail ne publient pas de build TestFlight.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    when:
      changeset:
        includes:
          - 'app/**'
          - 'codemagic.yaml'
        excludes:
          - '**/*.md'

    integrations:
      app_store_connect: chez-nous-asc

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thomasgomez.tracktime

    scripts:
      - name: Appliquer les profils de signature
        script: xcode-project use-profiles

      - name: Récupérer les paquets Flutter
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze

      - name: Tests unitaires
        # Bloquant : une build qui casse les tests ne part pas en TestFlight.
        # Le téléchargement de la bibliothèque SQLite par le paquet sqlite3
        # justifiait autrefois un ignore_failure ; masquer un vrai échec de
        # test pour ça coûtait bien plus cher qu'un run à relancer.
        script: flutter test

      - name: Installer les pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Construire l'IPA
        # Numéro de build = compteur Codemagic : strictement croissant, donc
        # toujours accepté par TestFlight.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Testeurs internes : disponible sans revue Apple.
        # beta_groups:
        #   - Testeurs internes

  # Workflow jetable (~1 min) : n'construit rien, affiche seulement ce que la
  # clé API « chez-nous-asc » voit réellement dans le compte Apple. Sert à
  # trancher entre « le profil n'existe pas » et « la clé appartient à une
  # autre équipe Apple », deux causes du même message d'erreur.
  diagnostic:
    name: Diagnostic signature
    max_build_duration: 10
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: chez-nous-asc

    scripts:
      - name: Bundle IDs visibles par la clé
        script: |
          echo "════════ BUNDLE IDS ════════"
          app-store-connect bundle-ids list || echo "(échec ou aucun)"
        ignore_failure: true

      - name: Certificats de distribution visibles
        script: |
          echo "════════ CERTIFICATS ════════"
          app-store-connect certificates list --type IOS_DISTRIBUTION \
            || echo "(échec ou aucun)"
        ignore_failure: true

      - name: Profils App Store visibles
        script: |
          echo "════════ PROFILS ════════"
          app-store-connect profiles list --type IOS_APP_STORE \
            || app-store-connect profiles list \
            || echo "(échec ou aucun)"
        ignore_failure: true
