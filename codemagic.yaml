# Codemagic — build iOS signé et envoi vers TestFlight.
#
# Prérequis (une seule fois) :
#  1. App Store Connect : fiche créée avec le bundle id com.thomasgomez.tracktime
#  2. Codemagic > Teams > Integrations > Apple Developer Portal : clé API
#     « chez-nous-asc » (partagée avec l'autre app du compte).
#  3. Lancer à la main (Start new build) : pas de déclenchement automatique,
#     les pushs sur main servent au déploiement Vercel.
#
# Signature : faite explicitement dans les scripts plutôt que via le bloc
# déclaratif `ios_signing`. Celui-ci se contente de CHERCHER un profil déjà
# existant et échoue à la configuration de l'environnement, avant les
# scripts (« No matching profiles found »). `fetch-signing-files --create`
# crée le profil et le certificat de distribution s'ils manquent.

workflows:
  ios-testflight:
    name: Nitrate · iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # L'app Flutter vit dans app/, pas à la racine du dépôt.
    working_directory: app

    integrations:
      app_store_connect: chez-nous-asc

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.thomasgomez.tracktime

    scripts:
      - name: Diagnostic — ce que la clé API voit
        # Non bloquant : sert à lever le doute. Une liste vide signifie que la
        # clé appartient à une autre équipe Apple que celle où le Bundle ID
        # est enregistré.
        script: |
          echo "── Bundle IDs visibles pour cette clé ──"
          app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier || true
        ignore_failure: true

      - name: Initialiser le trousseau
        script: keychain initialize

      - name: Récupérer (ou créer) profil et certificat
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create

      - name: Ajouter le certificat au trousseau
        script: keychain add-certificates

      - name: Appliquer les profils de signature
        script: xcode-project use-profiles

      - name: Récupérer les paquets Flutter
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze

      - name: Tests unitaires
        # ignore_failure : le paquet sqlite3 télécharge une lib native au
        # premier run ; un aléa réseau ne doit pas bloquer la livraison.
        script: flutter test
        ignore_failure: true

      - name: Installer les pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Construire l'IPA
        # Numéro de build = compteur Codemagic : strictement croissant, donc
        # toujours accepté par TestFlight.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Testeurs internes : disponible sans revue Apple.
        # beta_groups:
        #   - Testeurs internes
